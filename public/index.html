<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Office OS Pixel Office</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="iso-stage">
    <section class="iso-room">
      <div class="wall wall-left"></div>
      <div class="wall wall-right"></div>
      <div class="floor"></div>
      <div class="rug"></div>
      <div class="plant plant-a"></div>
      <div class="plant plant-b"></div>

      <header class="hud panel">
        <p class="kicker">OFFICE OS CONTROL ROOM</p>
        <h1>Office Ops Isometric View</h1>
        <p class="sub">Inspired by Monument Valley’s isometric calm + The Sims’ cozy office readability.</p>
        <div class="meta-row">
          <span id="now" class="badge">--</span>
          <span id="api-mode" class="badge soft">Data source: --</span>
        </div>
      </header>

      <section class="desk desk-left panel">
        <h2>Team Workers</h2>
        <div id="workers" class="workers"></div>
      </section>

      <section class="desk desk-right panel">
        <h2>Automation Jobs</h2>
        <div id="monitors" class="monitors"></div>
      </section>

      <section class="center panel summary-panel">
        <h2>At a Glance</h2>
        <div id="hero" class="hero"></div>
        <div id="summary" class="summary-grid"></div>
      </section>

      <section class="board-left panel">
        <details open>
          <summary>Task Board (Urgent first)</summary>
          <div id="backlog" class="board"></div>
        </details>
      </section>

      <section class="board-right panel">
        <details>
          <summary>Recent Completed Work</summary>
          <div id="ship" class="board"></div>
        </details>
      </section>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
