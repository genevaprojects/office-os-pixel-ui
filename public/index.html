<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Office OS Pixel Office</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <header class="top panel">
      <div>
        <p class="kicker">OFFICE OS CONTROL ROOM</p>
        <h1>Isometric Office Command Center</h1>
        <p class="sub">Each worker sits in a fixed cubicle so you can read who is doing what instantly.</p>
      </div>
      <div class="meta-row">
        <span id="now" class="badge">--</span>
        <span id="api-mode" class="badge soft">Data source: --</span>
      </div>
    </header>

    <section class="panel scene-panel">
      <h2>Live Office Floor</h2>
      <div id="hero" class="hero"></div>
      <div class="scene">
        <div class="cubicle research" id="worker-research"></div>
        <div class="cubicle builder" id="worker-builder"></div>
        <div class="cubicle social" id="worker-social"></div>
        <div class="cubicle executor" id="worker-executor"></div>
      </div>
    </section>

    <section class="panel summary-panel">
      <h2>At a Glance</h2>
      <div id="summary" class="summary-grid"></div>
    </section>

    <section class="panel">
      <h2>Automation Jobs</h2>
      <div id="monitors" class="monitors"></div>
    </section>

    <section class="panel">
      <details open>
        <summary>Task Board (Urgent first)</summary>
        <div id="backlog" class="board"></div>
      </details>
    </section>

    <section class="panel">
      <details>
        <summary>Recent Completed Work</summary>
        <div id="ship" class="board"></div>
      </details>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
