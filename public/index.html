<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Office OS Pixel Office</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="skyline"></div>

  <main class="office">
    <header class="panel top">
      <div>
        <p class="kicker">OFFICE OS CONTROL ROOM</p>
        <h1>Pixel Operations Dashboard</h1>
      </div>
      <div class="right-meta">
        <div id="now" class="timestamp">--</div>
        <div id="api-mode" class="small muted">Data source: --</div>
      </div>
    </header>

    <section class="panel summary-panel">
      <h2>At a Glance</h2>
      <div id="summary" class="summary-grid"></div>
    </section>

    <section class="panel">
      <div class="section-head">
        <h2>Workers</h2>
        <span class="small muted">Live status</span>
      </div>
      <div id="workers" class="workers"></div>
    </section>

    <section class="panel">
      <div class="section-head">
        <h2>Cron Monitors</h2>
        <span class="small muted">Health + next run</span>
      </div>
      <div id="monitors" class="monitors"></div>
    </section>

    <section class="panel">
      <details open>
        <summary>Backlog Board (P1 first)</summary>
        <div id="backlog" class="board"></div>
      </details>
    </section>

    <section class="panel">
      <details>
        <summary>Ship Log (latest)</summary>
        <div id="ship" class="board"></div>
      </details>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
