<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Office OS Pixel Office</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="skyline"></div>
  <main class="office">
    <header class="panel top">
      <h1>OFFICE OS // PIXEL OFFICE SIM</h1>
      <div id="now">--</div>
    </header>

    <section class="panel">
      <h2>Workers at Desks</h2>
      <div id="workers" class="workers"></div>
    </section>

    <section class="panel">
      <h2>In-Game Monitors (Cron Health)</h2>
      <div id="monitors" class="monitors"></div>
    </section>

    <section class="panel">
      <h2>BACKLOG Wall Task Board</h2>
      <div id="backlog" class="board"></div>
    </section>

    <section class="panel">
      <h2>SHIP_LOG Bulletin Board</h2>
      <div id="ship" class="board"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
